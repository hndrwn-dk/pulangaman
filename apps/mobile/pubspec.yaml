name: pulangaman
description: PulangAman — jaringan keselamatan untuk orang tua dan anak.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  path: ^1.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.10.0
  web_socket_channel: ^3.0.1
  go_router: ^14.6.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  battery_plus: 6.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  # 6.2.0-beta line required: stable 6.1.5 ships an Android Gradle config
  # (getDefaultProguardFile 'proguard-android.txt') rejected by newer AGP.
  flutter_inappwebview: 6.2.0-beta.3
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0
  firebase_app_check: ^0.4.5+2
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  image_path: "assets/icon/app_icon_1024.png"
  android: true
  ios: true
  adaptive_icon_background: "#16362C"
  adaptive_icon_foreground: "assets/icon/adaptive_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#16362C"
  image: "assets/icon/splash_logo_transparent.png"
  android_12:
    color: "#16362C"
    image: "assets/icon/splash_logo_transparent.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
